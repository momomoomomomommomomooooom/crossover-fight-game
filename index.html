<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossover Fight Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        #gameContainer {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0f0f1e;
        }

        #canvas {
            flex: 1;
            display: block;
            background: linear-gradient(to bottom, #2a2a4a, #1a1a2e);
        }

        #menu, #gameOver, #characterSelect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 30, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        #menu.hidden, #gameOver.hidden, #characterSelect.hidden {
            display: none;
        }

        h1 {
            font-size: 4em;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        h2 {
            font-size: 2.5em;
            margin-bottom: 40px;
            text-shadow: 0 0 15px rgba(0, 255, 100, 0.6);
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            margin: 10px;
            cursor: pointer;
            border: 2px solid #00ff64;
            background: rgba(0, 255, 100, 0.1);
            color: #00ff64;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 100, 0.3);
        }

        button:hover {
            background: rgba(0, 255, 100, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 100, 0.6);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        #characterSelect {
            overflow-y: auto;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            padding: 40px;
            width: 90%;
            max-width: 1200px;
        }

        .character-card {
            padding: 20px;
            border: 2px solid #666;
            background: rgba(50, 50, 80, 0.5);
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            border-radius: 8px;
        }

        .character-card:hover {
            border-color: #00ff64;
            background: rgba(0, 255, 100, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 100, 0.4);
            transform: translateY(-5px);
        }

        .character-card.selected {
            border-color: #ff0000;
            background: rgba(255, 0, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        }

        .character-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .character-faction {
            font-size: 0.9em;
            color: #aaa;
        }

        #gameOverText {
            font-size: 2em;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }

        #gameTitle {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5em;
            text-shadow: 0 0 10px rgba(0, 255, 100, 0.6);
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="gameTitle">CROSSOVER FIGHT</div>
        <canvas id="canvas"></canvas>

        <div id="menu">
            <h1>⚔️ CROSSOVER FIGHT ⚔️</h1>
            <p style="font-size: 1.2em; margin-bottom: 50px; color: #aaa;">Marvel • DC • X-Men • Wizarding World</p>
            <button onclick="startCharacterSelect()">START GAME</button>
            <button onclick="showInstructions()">HOW TO PLAY</button>
        </div>

        <div id="characterSelect" class="hidden">
            <h2>SELECT YOUR FIGHTER</h2>
            <div class="character-grid" id="p1Characters"></div>
            <button onclick="goBackToMenu()">BACK</button>
        </div>

        <div id="gameOver" class="hidden">
            <h2>FIGHT END</h2>
            <div id="gameOverText"></div>
            <button onclick="restartGame()">PLAY AGAIN</button>
            <button onclick="goBackToMenu()">MAIN MENU</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
